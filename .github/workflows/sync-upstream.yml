name: Sync upstream

on:
  schedule:
    # 毎日 00:00 UTC = 09:00 JST
    - cron: "0 0 * * *"

  # Webから手動実行可能
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/AIPentest/CyberStrikeAI.git
          git fetch upstream main

      - name: Merge upstream
        run: |
          git merge upstream/main --no-edit

      - name: Push
        run: |
          git push origin main
